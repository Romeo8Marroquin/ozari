  'postcss@^8': '^8.5.23'
  'nanoid@^3': '^3.3.18'
  'source-map-js@^1': '^1.2.2'
  '@hono/node-server@<1.19.13': '>=1.19.13'
  braces@<3.0.3: '>=3.0.3'
  hono@<4.11.7: '>=4.11.7'
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  micromatch@<4.0.8: '>=4.0.8'
  tar@<7.5.7: '>=7.5.7'
  tar@<=7.5.2: '>=7.5.3'
  tar@<=7.5.3: '>=7.5.4'

