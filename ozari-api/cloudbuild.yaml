# =============================================================================
# Ozari API — build, migrate, deploy.
#
# ONE file serves every environment. Nothing here names staging or production: the trigger's
# substitutions do, and Terraform owns those (modules/gcp-env/cloud-build.tf). Staging deploys this
# from `dev` in its project; production deploys the same file from `main` in its own project.
#
# ⚠️ `_SET_ENV_VARS` and `_SET_SECRETS` are COMPUTED BY TERRAFORM from the same locals that define
# the Cloud Run service (modules/gcp-env/locals.tf + secrets.tf). Do not expand them back into a
# hand-written list here. `gcloud run deploy --set-env-vars` REPLACES the whole environment, so when
# this file and Terraform each kept their own copy of that list, adding a variable to one silently
# wiped it from the service on the next deploy by the other. That class of bug is now unexpressible.
#
# The literal values below are FALLBACKS for a manual `gcloud builds submit` with no trigger. They
# describe staging. A real deploy always overrides them.
# =============================================================================
substitutions:
  _REGION: northamerica-south1
  # Staging's Cloud Run service is named ozari-api (NOT ozari-api-staging). Do not rename.
  _SERVICE_NAME: ozari-api
  _IMAGE_URL: northamerica-south1-docker.pkg.dev/$PROJECT_ID/ozari-images/ozari-api
  _RUN_SA: ozari-run-sa@$PROJECT_ID.iam.gserviceaccount.com

  # The runtime contract. Terraform overrides both; see the warning above.
  _SET_ENV_VARS: >-
    NODE_ENV=staging,LOG_LEVEL=info,APP_HOST=https://staging.partyrentalsgt.com,API_PUBLIC_URL=https://api-staging.partyrentalsgt.com,R2_ENDPOINT=,R2_BUCKET_NAME=,R2_PUBLIC_URL=
  _SET_SECRETS: >-
    DATABASE_URL=ozari-database-url:latest,JWT_SECRET=ozari-jwt-secret:latest,JWT_REFRESH_SECRET=ozari-jwt-refresh-secret:latest,ENCRYPTION_KEY=ozari-encryption-key:latest,API_KEY=ozari-api-key:latest,EMAIL_KEY=ozari-email-key:latest,R2_ACCESS_KEY=ozari-r2-access-key:latest,R2_SECRET_KEY=ozari-r2-secret-key:latest,GOOGLE_CLIENT_ID=ozari-google-client-id:latest,GOOGLE_CLIENT_SECRET=ozari-google-client-secret:latest

  # Cloud Run shape. Terraform sets these from the same variables it uses for the service, so an
  # apply and a deploy cannot disagree about the spend cap or the timeout.
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '3'
  _CONCURRENCY: '40'
  # A backstop above the app's own 30s request/response timeout.
  _TIMEOUT: '60'
  _CPU: '1'
  _MEMORY: 512Mi

  # Migrations run as the OWNER role. This secret is never bound to the running service.
  _DIRECT_DATABASE_URL_SECRET: ozari-direct-database-url

steps:
  - id: verify-api
    name: node:22-bookworm-slim
    dir: ozari-api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -y
        apt-get install -y --no-install-recommends openssl ca-certificates
        rm -rf /var/lib/apt/lists/*
        corepack enable
        pnpm install --frozen-lockfile
        pnpm build
        pnpm type-check

  - id: build-docker-image
    name: gcr.io/cloud-builders/docker
    dir: ozari-api
    args:
      - build
      - --tag
      - ${_IMAGE_URL}:$COMMIT_SHA
      - --tag
      - ${_IMAGE_URL}:latest
      - .

  - id: push-docker-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_IMAGE_URL}

  # Migrations run from the image that is about to be deployed, so the schema and the code that
  # expects it are always the same commit.
  - id: apply-prisma-migrations
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        docker run --rm \
          --env DATABASE_URL="$$DIRECT_DATABASE_URL" \
          "${_IMAGE_URL}:$COMMIT_SHA" \
          pnpm prisma:migrate:deploy
    secretEnv:
      - DIRECT_DATABASE_URL

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE_URL}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUN_SA}
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --set-env-vars=${_SET_ENV_VARS}
      - --set-secrets=${_SET_SECRETS}

images:
  - ${_IMAGE_URL}:$COMMIT_SHA
  - ${_IMAGE_URL}:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DIRECT_DATABASE_URL_SECRET}/versions/latest
      env: DIRECT_DATABASE_URL

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
