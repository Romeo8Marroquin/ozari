name: Database Migrations

on:
  push:
    branches:
      - dev
    paths:
      - "ozari-api/prisma/schema.prisma"
      - "ozari-api/prisma/migrations/**"
      - "ozari-api/prisma.config.ts"
      - ".github/workflows/deploy-dev.yml"

env:
  NODE_VERSION: 22

jobs:
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: ozari-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate dev
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Summary
        run: |
          echo "## Database Migrations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Migrations applied successfully." >> $GITHUB_STEP_SUMMARY
