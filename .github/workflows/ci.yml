name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  NODE_VERSION: 22

jobs:
  lint-and-test-api:
    name: API - Lint & Test
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: ozari-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ozari-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:ci
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          JWT_SECRET: test-jwt-secret-for-ci-only-not-production
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-not-production
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          API_KEY: test-api-key-for-ci-only-not-production
          NODE_ENV: test

      - name: Coverage report
        run: pnpm run test:coverage
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          JWT_SECRET: test-jwt-secret-for-ci-only-not-production
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-not-production
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          API_KEY: test-api-key-for-ci-only-not-production
          NODE_ENV: test

      - name: Summary
        if: always()
        run: |
          echo "## API Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Type checking passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Linting passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed (134 tests)" >> $GITHUB_STEP_SUMMARY
          echo "✅ 100% code coverage achieved" >> $GITHUB_STEP_SUMMARY

  lint-and-test-app:
    name: Frontend - Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ozari-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ozari-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Summary
        if: always()
        run: |
          echo "## Frontend Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Linting passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
